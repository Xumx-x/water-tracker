<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💧 喝了么</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --card: #ffffff;
    --primary: #2196F3;
    --primary-light: #64B5F6;
    --primary-dark: #1565C0;
    --accent: #00BCD4;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --success: #4CAF50;
    --danger: #ef5350;
    --warning: #FF9800;
    --shadow: 0 2px 12px rgba(33, 150, 243, 0.1);
    --radius: 16px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #e3f2fd 0%, #f0f6ff 50%, #e8f5e9 100%);
    min-height: 100vh;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .container {
    max-width: 520px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .header {
    text-align: center;
    padding: 20px 0 8px;
    position: relative;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    color: var(--text-secondary);
    font-size: 14px;
    margin-top: 4px;
  }
  .header-actions {
    position: absolute;
    top: 20px;
    right: 0;
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .icon-btn {
    width: 34px;
    height: 34px;
    border: none;
    background: var(--card);
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    transition: transform 0.15s;
    position: relative;
  }
  .icon-btn:hover { transform: scale(1.1); }

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 6px;
  }
  .status-bar .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .status-bar .dot.file { background: var(--success); }
  .status-bar .dot.browser { background: var(--primary-light); }

  .progress-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 24px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .ring-container { position: relative; width: 180px; height: 180px; }
  .ring-svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #e3f2fd; stroke-width: 14; }
  .ring-fill {
    fill: none; stroke: url(#ringGradient);
    stroke-width: 14; stroke-linecap: round;
    transition: stroke-dashoffset 0.6s ease;
  }
  .ring-center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .ring-center .amount { font-size: 36px; font-weight: 800; color: var(--primary-dark); }
  .ring-center .unit { font-size: 14px; color: var(--text-secondary); }
  .ring-center .goal-text { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  .progress-info {
    display: flex; gap: 24px; width: 100%;
    justify-content: center;
    padding-top: 8px;
    border-top: 1px solid #f0f0f0;
  }
  .progress-info .item { text-align: center; }
  .progress-info .item .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .progress-info .item .value { font-size: 18px; font-weight: 700; color: var(--text); }
  .progress-info .item .value.complete { color: var(--success); }

  .quick-add-card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .quick-add-card h3 { font-size: 14px; color: var(--text-secondary); margin-bottom: 14px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
  .quick-add-card h3 .history-btn {
    font-size: 12px; color: var(--primary); cursor: pointer;
    font-weight: 500; background: none; border: none;
    transition: opacity 0.2s;
  }
  .quick-add-card h3 .history-btn:hover { opacity: 0.7; }
  .add-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .add-btn {
    border: none;
    background: linear-gradient(135deg, #e3f2fd, #bbdefb);
    color: var(--primary-dark);
    border-radius: 12px;
    padding: 14px 8px;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
  }
  .add-btn:hover {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
  }
  .add-btn:active { transform: translateY(0); }
  .add-btn .icon { font-size: 22px; }
  .add-btn .ml { font-size: 12px; opacity: 0.8; }

  .custom-add { display: flex; gap: 8px; margin-top: 12px; }
  .custom-add input {
    flex: 1;
    border: 2px solid #e3f2fd;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px; outline: none;
    transition: border-color 0.2s;
  }
  .custom-add input:focus { border-color: var(--primary-light); }
  .custom-add button {
    border: none; background: var(--primary); color: white;
    border-radius: 10px; padding: 10px 18px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.2s;
  }
  .custom-add button:hover { background: var(--primary-dark); }

  .log-card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .log-card h3 {
    font-size: 14px; color: var(--text-secondary);
    margin-bottom: 14px; font-weight: 500;
    display: flex; justify-content: space-between; align-items: center;
  }
  .log-card h3 .clear-btn {
    font-size: 12px; color: var(--danger); cursor: pointer;
    font-weight: 400; background: none; border: none;
    transition: opacity 0.2s;
  }
  .log-card h3 .clear-btn:hover { opacity: 0.7; }
  .log-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
  .log-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: #f5faff; border-radius: 10px;
    transition: background 0.2s;
  }
  .log-item:hover { background: #e3f2fd; }
  .log-item .left { display: flex; align-items: center; gap: 10px; }
  .log-item .cup-icon { font-size: 20px; }
  .log-item .time { font-size: 13px; color: var(--text-secondary); }
  .log-item .amount-text { font-weight: 600; color: var(--primary-dark); }
  .log-item .actions { display: flex; align-items: center; gap: 8px; }
  .log-item .edit-btn, .log-item .delete-btn, .log-item .save-btn, .log-item .cancel-btn {
    background: none; border: none; cursor: pointer; font-size: 16px;
    transition: color 0.2s; padding: 2px 4px;
  }
  .log-item .edit-btn { color: #999; }
  .log-item .edit-btn:hover { color: var(--primary); }
  .log-item .delete-btn { color: #ccc; }
  .log-item .delete-btn:hover { color: var(--danger); }
  .log-item .save-btn { color: var(--success); font-size: 15px; }
  .log-item .cancel-btn { color: var(--danger); font-size: 15px; }
  .log-item .edit-input {
    width: 64px; border: 2px solid var(--primary-light); border-radius: 6px;
    padding: 4px 8px; font-size: 14px; outline: none; text-align: right;
  }
  .log-empty { text-align: center; color: var(--text-secondary); font-size: 14px; padding: 20px; }

  .chart-card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .chart-card h3 {
    font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; font-weight: 500;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chart-card h3 .history-btn {
    font-size: 12px; color: var(--primary); cursor: pointer;
    font-weight: 500; background: none; border: none;
    transition: opacity 0.2s;
  }
  .chart-card h3 .history-btn:hover { opacity: 0.7; }
  .chart {
    display: flex; justify-content: space-between; align-items: flex-end;
    height: 140px; gap: 6px; padding-bottom: 24px; position: relative;
  }
  .chart::after {
    content: ''; position: absolute; bottom: 24px; left: 0; right: 0;
    height: 1px; background: #eee;
  }
  .bar-group {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 6px; height: 100%; justify-content: flex-end;
  }
  .bar {
    width: 70%; max-width: 36px; border-radius: 6px 6px 0 0;
    background: linear-gradient(180deg, var(--primary-light), var(--primary));
    transition: height 0.5s ease; min-height: 2px;
  }
  .bar.today { background: linear-gradient(180deg, var(--accent), var(--primary-dark)); }
  .bar.complete { background: linear-gradient(180deg, #81C784, var(--success)); }
  .bar-label { font-size: 11px; color: var(--text-secondary); }
  .bar-amount { font-size: 10px; color: var(--text-secondary); margin-bottom: 2px; }

  .goal-card {
    background: var(--card); border-radius: var(--radius);
    padding: 16px 20px; box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: space-between;
  }
  .goal-card .label { font-size: 14px; color: var(--text-secondary); }
  .goal-card .goal-control { display: flex; align-items: center; gap: 8px; }
  .goal-card button {
    width: 30px; height: 30px; border: none; background: #e3f2fd;
    color: var(--primary-dark); border-radius: 8px; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .goal-card button:hover { background: #bbdefb; }
  .goal-card .goal-value {
    font-size: 18px; font-weight: 700; color: var(--primary-dark);
    min-width: 60px; text-align: center;
  }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--primary-dark); color: white;
    padding: 12px 24px; border-radius: 12px; font-size: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    opacity: 0; transition: all 0.3s ease;
    z-index: 1000; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3);
    display: none; align-items: center; justify-content: center; z-index: 2000;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card); border-radius: var(--radius);
    padding: 28px 24px; max-width: 400px; width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2); text-align: center;
  }
  .modal h3 { font-size: 18px; margin-bottom: 8px; }
  .modal p { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
  .modal .actions { display: flex; gap: 10px; justify-content: center; }
  .modal .btn {
    border: none; border-radius: 10px; padding: 10px 24px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  .modal .btn-confirm { background: var(--danger); color: white; }
  .modal .btn-confirm:hover { background: #d32f2f; }
  .modal .btn-cancel { background: #f0f0f0; color: var(--text-secondary); }
  .modal .btn-cancel:hover { background: #e0e0e0; }

  /* History modal */
  .history-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; z-index: 2000;
    padding: 20px;
  }
  .history-modal-overlay.show { display: flex; }
  .history-modal {
    background: var(--card); border-radius: var(--radius);
    max-width: 560px; width: 95%; max-height: 85vh;
    display: flex; flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .history-modal .hm-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 24px 12px; border-bottom: 1px solid #f0f0f0;
  }
  .history-modal .hm-header h3 { font-size: 18px; font-weight: 700; }
  .history-modal .hm-close {
    background: none; border: none; font-size: 20px; color: var(--text-secondary);
    cursor: pointer; padding: 4px 8px;
  }
  .history-modal .hm-close:hover { color: var(--danger); }

  .hm-filters {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 12px 24px 8px;
  }
  .hm-filter-btn {
    border: 1.5px solid #e3f2fd; background: var(--card); color: var(--text-secondary);
    border-radius: 8px; padding: 5px 12px; font-size: 13px;
    cursor: pointer; transition: all 0.2s;
  }
  .hm-filter-btn:hover { border-color: var(--primary-light); }
  .hm-filter-btn.active {
    background: var(--primary); color: white; border-color: var(--primary);
  }
  .hm-date-range {
    display: none; align-items: center; gap: 8px;
    padding: 0 24px 10px; flex-wrap: wrap;
  }
  .hm-date-range.show { display: flex; }
  .hm-date-range input[type="date"] {
    border: 1.5px solid #e3f2fd; border-radius: 8px;
    padding: 5px 10px; font-size: 13px; outline: none; color: var(--text);
  }
  .hm-date-range input[type="date"]:focus { border-color: var(--primary-light); }
  .hm-date-range button {
    border: none; background: var(--primary); color: white;
    border-radius: 8px; padding: 5px 14px; font-size: 13px;
    cursor: pointer; font-weight: 600;
  }
  .hm-date-range button:hover { background: var(--primary-dark); }
  .hm-date-range .range-sep { color: var(--text-secondary); font-size: 13px; }

  .history-modal .hm-body {
    overflow-y: auto; padding: 8px 24px 12px; flex: 1;
  }

  .day-row {
    border: 1px solid #f0f0f0; border-radius: 10px;
    margin-bottom: 8px; overflow: hidden;
  }
  .day-row-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; cursor: pointer; user-select: none;
    background: #fafcff; transition: background 0.2s;
  }
  .day-row-header:hover { background: #e3f2fd; }
  .day-row-header .dr-left { display: flex; align-items: center; gap: 8px; }
  .day-row-header .dr-arrow {
    font-size: 12px; color: var(--text-secondary);
    transition: transform 0.2s; display: inline-block;
  }
  .day-row.expanded .dr-arrow { transform: rotate(90deg); }
  .day-row-header .dr-date { font-size: 15px; font-weight: 600; color: var(--text); }
  .day-row-header .dr-right { display: flex; align-items: center; gap: 10px; }
  .day-row-header .dr-count { font-size: 12px; color: var(--text-secondary); }
  .day-row-header .dr-total { font-size: 15px; font-weight: 700; color: var(--primary-dark); }
  .day-row-header .dr-total.complete { color: var(--success); }

  .day-records { display: none; padding: 4px 14px 10px 14px; }
  .day-row.expanded .day-records { display: block; }
  .day-record {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; margin: 3px 0; background: #f5faff; border-radius: 8px;
    font-size: 13px;
  }
  .day-record .dr-rec-time { color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  .day-record .dr-rec-amount { font-weight: 600; color: var(--primary-dark); }

  .history-empty { text-align: center; color: var(--text-secondary); padding: 40px 0; font-size: 14px; }

  .hm-pagination {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 24px 16px; border-top: 1px solid #f0f0f0;
    flex-wrap: wrap;
  }
  .hm-pagination button {
    border: 1.5px solid #e3f2fd; background: var(--card); color: var(--primary-dark);
    border-radius: 8px; padding: 5px 12px; font-size: 13px;
    cursor: pointer; transition: all 0.2s;
  }
  .hm-pagination button:hover:not(:disabled) { border-color: var(--primary); background: #e3f2fd; }
  .hm-pagination button:disabled { opacity: 0.4; cursor: default; }
  .hm-pagination .page-info { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
  .hm-pagination .page-input {
    width: 42px; text-align: center; border: 1.5px solid #e3f2fd;
    border-radius: 6px; padding: 3px 4px; font-size: 13px; outline: none; color: var(--text);
  }
  .hm-pagination .page-input:focus { border-color: var(--primary-light); }
  .hm-pagination .size-select {
    border: 1.5px solid #e3f2fd; border-radius: 6px; padding: 3px 6px;
    font-size: 12px; color: var(--text-secondary); outline: none; cursor: pointer;
  }
  .hm-pagination .total-info { font-size: 12px; color: var(--text-secondary); }

  .footer { text-align: center; padding: 8px 0 4px; font-size: 12px; color: var(--text-secondary); }

  @media (max-width: 480px) {
    .add-buttons { grid-template-columns: repeat(2, 1fr); }
    .ring-center .amount { font-size: 30px; }
    .header-actions { position: static; justify-content: center; margin-top: 8px; }
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
</style>
</head>
<body>

<!-- Auto-load data file from same folder.
     Uses .js extension (not .json) because browsers block <script> execution
     for files with application/json MIME type. The file contains valid JS:
     window.__WATER_DATA__ = { ... }; -->
<script src="water-data.js" onerror="window.__WATER_DATA__=null"></script>

<div class="container">
  <div class="header">
    <h1>💧 喝了么</h1>
    <p id="dateText"></p>
    <div class="status-bar" id="statusBar"></div>
    <div class="header-actions">
      <button class="icon-btn" onclick="exportData()" title="导出数据">📤</button>
      <button class="icon-btn" onclick="document.getElementById('importFile').click()" title="从文件导入数据">📥</button>
      <input type="file" id="importFile" accept=".js,.json" style="display:none" onchange="importData(event)">
    </div>
  </div>

  <div class="progress-card">
    <div class="ring-container">
      <svg class="ring-svg" width="180" height="180" viewBox="0 0 180 180">
        <defs>
          <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2196F3" />
            <stop offset="100%" stop-color="#00BCD4" />
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="90" cy="90" r="76" />
        <circle class="ring-fill" id="ringFill" cx="90" cy="90" r="76"
                stroke-dasharray="477.5" stroke-dashoffset="477.5" />
      </svg>
      <div class="ring-center">
        <div class="amount" id="todayAmount">0</div>
        <div class="unit">ml</div>
        <div class="goal-text" id="goalText">目标 2000ml</div>
      </div>
    </div>
    <div class="progress-info">
      <div class="item">
        <div class="label">完成度</div>
        <div class="value" id="percentText">0%</div>
      </div>
      <div class="item">
        <div class="label">还需</div>
        <div class="value" id="remainingText">2000ml</div>
      </div>
      <div class="item">
        <div class="label">记录次数</div>
        <div class="value" id="countText">0</div>
      </div>
    </div>
  </div>

  <div class="quick-add-card">
    <h3>
      <span>🚰 快速记录</span>
      <button class="history-btn" onclick="openBackfill()">📅 补录历史</button>
    </h3>
    <div class="add-buttons">
      <button class="add-btn" onclick="addWater(150)">
        <span class="icon">🥛</span><span>小杯</span><span class="ml">150ml</span>
      </button>
      <button class="add-btn" onclick="addWater(250)">
        <span class="icon">☕</span><span>标准杯</span><span class="ml">250ml</span>
      </button>
      <button class="add-btn" onclick="addWater(400)">
        <span class="icon">🍵</span><span>大杯</span><span class="ml">400ml</span>
      </button>
      <button class="add-btn" onclick="addWater(500)">
        <span class="icon">🥤</span><span>水瓶</span><span class="ml">500ml</span>
      </button>
    </div>
    <div class="custom-add">
      <input type="number" id="customAmount" placeholder="自定义 ml 数量" min="1" max="5000">
      <button onclick="addCustom()">添加</button>
    </div>
  </div>

  <div class="goal-card">
    <span class="label">🎯 每日目标</span>
    <div class="goal-control">
      <button onclick="changeGoal(-100)">−</button>
      <span class="goal-value" id="goalValue">2000ml</span>
      <button onclick="changeGoal(100)">+</button>
    </div>
  </div>

  <div class="log-card">
    <h3>
      <span>📋 今日记录</span>
      <button class="clear-btn" onclick="confirmClear()">清空今日</button>
    </h3>
    <div class="log-list" id="logList">
      <div class="log-empty">还没有记录，点击上方按钮开始 💧</div>
    </div>
  </div>

  <div class="chart-card">
    <h3>
      <span>📊 近 7 天趋势</span>
      <button class="history-btn" onclick="showHistory()">📜 查看全部历史</button>
    </h3>
    <div class="chart" id="chart"></div>
  </div>

  <div class="footer">💧 喝水追踪器 · 双击打开即用 · 数据自动保存</div>
</div>

<div class="toast" id="toast"></div>

<!-- Clear confirmation modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>清空今日记录？</h3>
    <p>此操作会删除今天的所有喝水记录，不可撤销。</p>
    <div class="actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-confirm" onclick="clearToday()">确认清空</button>
    </div>
  </div>
</div>

<!-- Backfill modal -->
<div class="modal-overlay" id="backfillOverlay">
  <div class="modal" style="max-width: 420px; text-align: left; padding: 24px;">
    <h3 style="text-align: center; margin-bottom: 6px;">📅 补录喝水记录</h3>
    <p style="text-align: center; margin-bottom: 18px;">选择日期和时间，补录漏掉的喝水数据</p>

    <div style="display: flex; gap: 10px; margin-bottom: 16px;">
      <div style="flex: 1;">
        <label style="font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 6px;">日期</label>
        <input type="date" id="backfillDate" max="" style="width: 100%; border: 2px solid #e3f2fd; border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none; color: var(--text);">
      </div>
      <div style="flex: 1;">
        <label style="font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 6px;">时间</label>
        <input type="time" id="backfillTime" style="width: 100%; border: 2px solid #e3f2fd; border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none; color: var(--text);">
      </div>
    </div>

    <label style="font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 8px;">快速选择容量</label>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px;">
      <button class="add-btn" onclick="backfillAdd(150)"><span class="icon">🥛</span><span>小杯</span><span class="ml">150ml</span></button>
      <button class="add-btn" onclick="backfillAdd(250)"><span class="icon">☕</span><span>标准杯</span><span class="ml">250ml</span></button>
      <button class="add-btn" onclick="backfillAdd(400)"><span class="icon">🍵</span><span>大杯</span><span class="ml">400ml</span></button>
      <button class="add-btn" onclick="backfillAdd(500)"><span class="icon">🥤</span><span>水瓶</span><span class="ml">500ml</span></button>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
      <input type="number" id="backfillAmount" placeholder="自定义 ml 数量" min="1" max="5000" style="flex: 1; border: 2px solid #e3f2fd; border-radius: 10px; padding: 10px 14px; font-size: 14px; outline: none;">
      <button onclick="backfillCustom()" style="border: none; background: var(--primary); color: white; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;">添加</button>
    </div>

    <div id="backfillPreview" style="margin-bottom: 16px; padding: 10px 14px; background: #f5faff; border-radius: 10px; font-size: 13px; color: var(--text-secondary); display: none;"></div>

    <div class="actions" style="justify-content: center;">
      <button class="btn btn-cancel" onclick="closeBackfill()">关闭</button>
    </div>
  </div>
</div>

<!-- History modal -->
<div class="history-modal-overlay" id="historyOverlay" onclick="if(event.target===this)closeHistory()">
  <div class="history-modal">
    <div class="hm-header">
      <h3>📜 历史记录</h3>
      <button class="hm-close" onclick="closeHistory()">✕</button>
    </div>
    <div class="hm-filters">
      <button class="hm-filter-btn" onclick="setHistoryFilter('week')">最近一周</button>
      <button class="hm-filter-btn active" onclick="setHistoryFilter('month')">最近一月</button>
      <button class="hm-filter-btn" onclick="setHistoryFilter('quarter')">最近三月</button>
      <button class="hm-filter-btn" onclick="setHistoryFilter('all')">全部</button>
      <button class="hm-filter-btn" onclick="setHistoryFilter('custom')">自定义</button>
    </div>
    <div class="hm-date-range" id="dateRangeBar">
      <input type="date" id="dateFrom">
      <span class="range-sep">至</span>
      <input type="date" id="dateTo">
      <button onclick="applyCustomRange()">查询</button>
    </div>
    <div class="hm-body" id="historyBody"></div>
    <div class="hm-pagination" id="historyPagination"></div>
  </div>
</div>

<script>
  var STORAGE_KEY = 'water_tracker_data_v1';
  var DEFAULT_GOAL = 2000;
  var RING_CIRCUMFERENCE = 2 * Math.PI * 76;

  // ---- Data layer ----

  function loadData() {
    // 1. localStorage first — has the most recent data (auto-saved on every change)
    try {
      var stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        var parsed = JSON.parse(stored);
        if (parsed && typeof parsed === 'object') return parsed;
      }
    } catch(e) {}
    // 2. Fall back to file data (first visit, or after clearing browser data)
    if (window.__WATER_DATA__ && typeof window.__WATER_DATA__ === 'object') {
      var fileData = window.__WATER_DATA__;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fileData)); } catch(e) {}
      return fileData;
    }
    // 3. Nothing available
    return {};
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    // Also update in-memory copy so subsequent reads are consistent
    window.__WATER_DATA__ = data;
  }

  function getGoal() {
    var data = loadData();
    return data._goal || DEFAULT_GOAL;
  }

  // ---- Date helpers ----

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function dateStr(offset) {
    var d = new Date();
    d.setDate(d.getDate() + offset);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function dayLabel(offset) {
    var d = new Date();
    d.setDate(d.getDate() + offset);
    return ['日','一','二','三','四','五','六'][d.getDay()];
  }
  function formatDateDisplay(dateStr) {
    var parts = dateStr.split('-');
    var d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
    var weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    return parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日 ' + weekdays[d.getDay()];
  }

  function getTodayLog() {
    return loadData()[todayStr()] || [];
  }
  function getDayTotal(date) {
    var log = loadData()[date] || [];
    return log.reduce(function(sum, r) { return sum + r.amount; }, 0);
  }

  // ---- Actions ----

  function addWater(amount) {
    var data = loadData();
    var today = todayStr();
    if (!data[today]) data[today] = [];
    var now = new Date();
    var time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    data[today].push({ time: time, amount: amount, id: Date.now() });
    saveData(data);
    showToast('+' + amount + 'ml 💧 已记录！');
    renderAll();
  }

  function addCustom() {
    var input = document.getElementById('customAmount');
    var val = parseInt(input.value);
    if (!val || val <= 0 || val > 5000) { showToast('请输入 1-5000 之间的数字'); return; }
    input.value = '';
    addWater(val);
  }

  function deleteRecord(id) {
    var data = loadData();
    var today = todayStr();
    if (!data[today]) return;
    data[today] = data[today].filter(function(r) { return r.id !== id; });
    saveData(data);
    renderAll();
  }

  // ---- Inline edit ----

  var editingId = null;

  function startEdit(id) {
    editingId = id;
    renderLog();
    // Focus the input
    var input = document.getElementById('editInput_' + id);
    if (input) { input.focus(); input.select(); }
  }

  function saveEdit(id) {
    var input = document.getElementById('editInput_' + id);
    if (!input) return;
    var val = parseInt(input.value);
    if (!val || val <= 0 || val > 5000) {
      showToast('请输入 1-5000 之间的数字');
      return;
    }
    var data = loadData();
    var today = todayStr();
    var rec = (data[today] || []).find(function(r) { return r.id === id; });
    if (rec) {
      rec.amount = val;
      saveData(data);
      showToast('已修改为 ' + val + 'ml ✅');
    }
    editingId = null;
    renderAll();
  }

  function cancelEdit() {
    editingId = null;
    renderLog();
  }

  function handleEditKeydown(e, id) {
    if (e.key === 'Enter') { e.preventDefault(); saveEdit(id); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
  }

  function confirmClear() { document.getElementById('modalOverlay').classList.add('show'); }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

  function clearToday() {
    var data = loadData();
    data[todayStr()] = [];
    saveData(data);
    closeModal();
    showToast('今日记录已清空');
    renderAll();
  }

  function changeGoal(delta) {
    var data = loadData();
    var goal = (data._goal || DEFAULT_GOAL) + delta;
    if (goal < 500) goal = 500;
    if (goal > 10000) goal = 10000;
    data._goal = goal;
    saveData(data);
    renderAll();
  }

  // ---- Export / Import ----

  function generateFileContent(data) {
    return 'window.__WATER_DATA__ = ' + JSON.stringify(data, null, 2) + ';\n';
  }

  // Export: download current data as water-data.js
  function exportData() {
    var data = loadData();
    var content = generateFileContent(data);
    var blob = new Blob([content], { type: 'application/javascript' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'water-data.js';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('已导出 water-data.js 📤');
  }

  // Import: read file → load data → auto-overwrite water-data.js
  function importData(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var text = e.target.result;
      var data = null;
      var match = text.match(/window\.\s*__WATER_DATA__\s*=\s*([\s\S]+?);?\s*$/);
      if (match) {
        try { data = JSON.parse(match[1]); } catch(err) {}
      }
      if (!data) {
        try { data = JSON.parse(text); } catch(err) {}
      }
      if (!data || typeof data !== 'object') {
        showToast('导入失败：文件格式错误');
        event.target.value = '';
        return;
      }
      saveData(data);
      renderAll();
      // Auto-overwrite water-data.js
      var content = generateFileContent(data);
      var blob = new Blob([content], { type: 'application/javascript' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'water-data.js';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('数据导入成功，已自动覆盖 water-data.js ✅');
      event.target.value = '';
    };
    reader.readAsText(file);
  }

  // ---- Backfill (add records to historical dates) ----

  function openBackfill() {
    var y = dateStr(-1);
    document.getElementById('backfillDate').value = y;
    document.getElementById('backfillDate').max = todayStr();
    document.getElementById('backfillTime').value = '12:00';
    document.getElementById('backfillAmount').value = '';
    updateBackfillPreview();
    document.getElementById('backfillOverlay').classList.add('show');
  }

  function openBackfillForDate(date) {
    document.getElementById('backfillDate').value = date;
    document.getElementById('backfillDate').max = todayStr();
    document.getElementById('backfillTime').value = '12:00';
    document.getElementById('backfillAmount').value = '';
    updateBackfillPreview();
    document.getElementById('backfillOverlay').classList.add('show');
  }

  function closeBackfill() {
    document.getElementById('backfillOverlay').classList.remove('show');
  }

  function getBackfillDate() {
    return document.getElementById('backfillDate').value || todayStr();
  }

  function getBackfillTime() {
    return document.getElementById('backfillTime').value || '12:00';
  }

  function backfillAdd(amount) {
    var date = getBackfillDate();
    var time = getBackfillTime();
    if (date > todayStr()) {
      showToast('不能选择未来的日期');
      return;
    }
    var data = loadData();
    if (!data[date]) data[date] = [];
    data[date].push({ time: time, amount: amount, id: Date.now() });
    saveData(data);
    showToast('已补录 ' + amount + 'ml 到 ' + formatDateDisplay(date));
    updateBackfillPreview();
    renderAll();
    // Refresh history modal if it's open
    if (document.getElementById('historyOverlay').classList.contains('show')) {
      renderHistory();
    }
  }

  function backfillCustom() {
    var input = document.getElementById('backfillAmount');
    var val = parseInt(input.value);
    if (!val || val <= 0 || val > 5000) {
      showToast('请输入 1-5000 之间的数字');
      return;
    }
    input.value = '';
    backfillAdd(val);
  }

  function updateBackfillPreview() {
    var date = getBackfillDate();
    var preview = document.getElementById('backfillPreview');
    var data = loadData();
    var records = data[date] || [];
    if (records.length === 0) {
      preview.style.display = 'none';
      return;
    }
    var total = records.reduce(function(s, r) { return s + r.amount; }, 0);
    var goal = data._goal || DEFAULT_GOAL;
    var isComplete = total >= goal;
    preview.style.display = 'block';
    preview.innerHTML = '📋 ' + formatDateDisplay(date) + ' · 已有 ' + records.length + ' 条记录 · 合计 ' + total + 'ml' + (isComplete ? ' ✅ 已达标' : '');
  }

  // ---- Toast ----

  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2000);
  }

  // ---- History modal ----

  var historyState = {
    page: 1,
    pageSize: 10,
    filter: 'month',       // week | month | quarter | all | custom
    dateFrom: '',
    dateTo: '',
    expandedDays: {}       // { "2026-08-10": true, ... }
  };

  function getFilteredDates() {
    var data = loadData();
    var dates = Object.keys(data).filter(function(k) {
      return k !== '_goal' && /^\d{4}-\d{2}-\d{2}$/.test(k);
    });

    // Compute date range
    var from = null, to = null;
    var now = new Date();
    if (historyState.filter === 'week') {
      from = new Date(now); from.setDate(from.getDate() - 6);
    } else if (historyState.filter === 'month') {
      from = new Date(now); from.setDate(from.getDate() - 29);
    } else if (historyState.filter === 'quarter') {
      from = new Date(now); from.setDate(from.getDate() - 89);
    } else if (historyState.filter === 'custom') {
      if (historyState.dateFrom) from = new Date(historyState.dateFrom + 'T00:00:00');
      if (historyState.dateTo) to = new Date(historyState.dateTo + 'T23:59:59');
    }
    // 'all' → no filter

    if (from || to) {
      dates = dates.filter(function(d) {
        var dt = new Date(d + 'T00:00:00');
        if (from && dt < from) return false;
        if (to && dt > to) return false;
        return true;
      });
    }

    dates.sort(function(a, b) { return b.localeCompare(a); });
    return dates;
  }

  function showHistory() {
    historyState.page = 1;
    historyState.expandedDays = {};
    // Default to last month
    historyState.filter = 'month';
    // Set default custom range dates
    var now = new Date();
    var monthAgo = new Date(now); monthAgo.setDate(monthAgo.getDate() - 29);
    historyState.dateFrom = monthAgo.getFullYear() + '-' + String(monthAgo.getMonth()+1).padStart(2,'0') + '-' + String(monthAgo.getDate()).padStart(2,'0');
    historyState.dateTo = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');

    // Update filter button states
    updateFilterButtons();
    // Update date range inputs
    document.getElementById('dateFrom').value = historyState.dateFrom;
    document.getElementById('dateTo').value = historyState.dateTo;
    // Hide custom range bar (only show when 'custom' is selected)
    document.getElementById('dateRangeBar').classList.remove('show');

    renderHistory();
    document.getElementById('historyOverlay').classList.add('show');
  }

  function closeHistory() {
    document.getElementById('historyOverlay').classList.remove('show');
  }

  function setHistoryFilter(filter) {
    historyState.filter = filter;
    historyState.page = 1;
    historyState.expandedDays = {};
    updateFilterButtons();
    if (filter === 'custom') {
      document.getElementById('dateRangeBar').classList.add('show');
    } else {
      document.getElementById('dateRangeBar').classList.remove('show');
    }
    renderHistory();
  }

  function updateFilterButtons() {
    var btns = document.querySelectorAll('.hm-filter-btn');
    btns.forEach(function(btn) {
      var map = { '最近一周': 'week', '最近一月': 'month', '最近三月': 'quarter', '全部': 'all', '自定义': 'custom' };
      var f = map[btn.textContent.trim()] || '';
      btn.classList.toggle('active', f === historyState.filter);
    });
  }

  function applyCustomRange() {
    historyState.dateFrom = document.getElementById('dateFrom').value || '';
    historyState.dateTo = document.getElementById('dateTo').value || '';
    historyState.page = 1;
    historyState.expandedDays = {};
    renderHistory();
  }

  function toggleDay(date) {
    historyState.expandedDays[date] = !historyState.expandedDays[date];
    renderHistory();
  }

  function changeHistoryPage(delta) {
    var dates = getFilteredDates();
    var totalPages = Math.max(1, Math.ceil(dates.length / historyState.pageSize));
    historyState.page = Math.max(1, Math.min(totalPages, historyState.page + delta));
    renderHistory();
  }

  function goToHistoryPage() {
    var input = document.getElementById('hmPageInput');
    var page = parseInt(input.value);
    var dates = getFilteredDates();
    var totalPages = Math.max(1, Math.ceil(dates.length / historyState.pageSize));
    if (!page || page < 1) page = 1;
    if (page > totalPages) page = totalPages;
    historyState.page = page;
    renderHistory();
  }

  function changeHistoryPageSize(val) {
    historyState.pageSize = parseInt(val) || 10;
    historyState.page = 1;
    renderHistory();
  }

  function renderHistory() {
    var data = loadData();
    var goal = data._goal || DEFAULT_GOAL;
    var body = document.getElementById('historyBody');
    var pagBar = document.getElementById('historyPagination');
    var cupIcons = { 150: '\u{1F963}', 250: '\u2615', 400: '\u{1F375}', 500: '\u{1F964}' };

    var allDates = getFilteredDates();
    var totalDays = allDates.length;
    var totalPages = Math.max(1, Math.ceil(totalDays / historyState.pageSize));

    // Clamp page
    if (historyState.page > totalPages) historyState.page = totalPages;
    if (historyState.page < 1) historyState.page = 1;

    var startIdx = (historyState.page - 1) * historyState.pageSize;
    var pageDates = allDates.slice(startIdx, startIdx + historyState.pageSize);

    if (totalDays === 0) {
      body.innerHTML = '<div class="history-empty">该时间范围内没有记录 📭</div>';
      pagBar.innerHTML = '';
      return;
    }

    body.innerHTML = pageDates.map(function(date) {
      var records = data[date] || [];
      var total = records.reduce(function(s, r) { return s + r.amount; }, 0);
      var isComplete = total >= goal && goal > 0;
      var isExpanded = historyState.expandedDays[date];

      var recordsHtml = records.map(function(r) {
        var icon = cupIcons[r.amount] || '\u{1F4A7}';
        return '<div class="day-record">' +
          '<span class="dr-rec-time">' + icon + ' ' + r.time + '</span>' +
          '<span class="dr-rec-amount">' + r.amount + 'ml</span>' +
        '</div>';
      }).join('');

      // Add backfill button at the end of expanded records
      recordsHtml += '<div style="text-align: center; padding: 8px 0 2px;">' +
        '<button class="hm-filter-btn" onclick="openBackfillForDate(\'' + date + '\')" style="color: var(--primary); border-color: var(--primary-light);">＋ 为这天补录</button>' +
      '</div>';

      return '<div class="day-row' + (isExpanded ? ' expanded' : '') + '">' +
        '<div class="day-row-header" onclick="toggleDay(\'' + date + '\')">' +
          '<div class="dr-left">' +
            '<span class="dr-arrow">\u25B6</span>' +
            '<span class="dr-date">' + formatDateDisplay(date) + '</span>' +
          '</div>' +
          '<div class="dr-right">' +
            '<span class="dr-count">' + records.length + ' 条</span>' +
            '<span class="dr-total' + (isComplete ? ' complete' : '') + '">' + total + 'ml' + (isComplete ? ' \u2705' : '') + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="day-records">' + recordsHtml + '</div>' +
      '</div>';
    }).join('');

    // Pagination bar
    pagBar.innerHTML =
      '<span class="total-info">共 ' + totalDays + ' 天</span>' +
      '<button onclick="changeHistoryPage(-1)" ' + (historyState.page <= 1 ? 'disabled' : '') + '>\u2039 上一页</button>' +
      '<span class="page-info">第 <input type="number" class="page-input" id="hmPageInput" value="' + historyState.page + '" min="1" max="' + totalPages + '" onchange="goToHistoryPage()" onkeydown="if(event.key===\'Enter\'){event.preventDefault();goToHistoryPage();}"> / ' + totalPages + ' 页</span>' +
      '<button onclick="changeHistoryPage(1)" ' + (historyState.page >= totalPages ? 'disabled' : '') + '>下一页 \u203A</button>' +
      '<select class="size-select" onchange="changeHistoryPageSize(this.value)">' +
        '<option value="10"' + (historyState.pageSize === 10 ? ' selected' : '') + '>10条/页</option>' +
        '<option value="20"' + (historyState.pageSize === 20 ? ' selected' : '') + '>20条/页</option>' +
        '<option value="50"' + (historyState.pageSize === 50 ? ' selected' : '') + '>50条/页</option>' +
      '</select>';
  }

  // ---- Render ----

  function renderStatusBar() {
    var bar = document.getElementById('statusBar');
    if (window.__WATER_DATA__) {
      bar.innerHTML = '<span class="dot file"></span> 已从 water-data.js 自动加载';
    } else {
      bar.innerHTML = '<span class="dot browser"></span> 使用浏览器本地存储';
    }
  }

  function renderHeader() {
    var d = new Date();
    var weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    document.getElementById('dateText').textContent =
      d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + weekdays[d.getDay()];
  }

  function renderProgress() {
    var goal = getGoal();
    var total = getDayTotal(todayStr());
    var percent = Math.min(100, Math.round(total / goal * 100));
    var remaining = Math.max(0, goal - total);

    document.getElementById('todayAmount').textContent = total;
    document.getElementById('goalText').textContent = '目标 ' + goal + 'ml';
    document.getElementById('goalValue').textContent = goal + 'ml';

    var percentEl = document.getElementById('percentText');
    percentEl.textContent = percent + '%';
    percentEl.className = 'value' + (percent >= 100 ? ' complete' : '');

    document.getElementById('remainingText').textContent = remaining > 0 ? remaining + 'ml' : '已完成 ✅';
    document.getElementById('countText').textContent = getTodayLog().length;

    var offset = RING_CIRCUMFERENCE * (1 - Math.min(1, total / goal));
    document.getElementById('ringFill').style.strokeDashoffset = offset;

    if (percent >= 100) {
      showToast('🎉 太棒了！今日喝水目标已完成！');
    }
  }

  function renderLog() {
    var log = getTodayLog();
    var list = document.getElementById('logList');
    if (log.length === 0) {
      list.innerHTML = '<div class="log-empty">还没有记录，点击上方按钮开始 💧</div>';
      return;
    }
    var cupIcons = { 150: '🥛', 250: '☕', 400: '🍵', 500: '🥤' };
    list.innerHTML = log.slice().reverse().map(function(r) {
      var icon = cupIcons[r.amount] || '💧';

      // If this record is being edited, show inline edit UI
      if (editingId === r.id) {
        return '<div class="log-item">' +
          '<div class="left"><span class="cup-icon">' + icon + '</span><span class="time">' + r.time + '</span></div>' +
          '<div class="actions">' +
            '<input type="number" class="edit-input" id="editInput_' + r.id + '" value="' + r.amount + '" min="1" max="5000" onkeydown="handleEditKeydown(event,' + r.id + ')">' +
            '<span style="font-size:12px;color:var(--text-secondary);">ml</span>' +
            '<button class="save-btn" onclick="saveEdit(' + r.id + ')" title="保存">✓</button>' +
            '<button class="cancel-btn" onclick="cancelEdit()" title="取消">✕</button>' +
          '</div>' +
        '</div>';
      }

      return '<div class="log-item">' +
        '<div class="left"><span class="cup-icon">' + icon + '</span><span class="time">' + r.time + '</span></div>' +
        '<div class="actions">' +
          '<span class="amount-text">' + r.amount + 'ml</span>' +
          '<button class="edit-btn" onclick="startEdit(' + r.id + ')" title="编辑">✎</button>' +
          '<button class="delete-btn" onclick="deleteRecord(' + r.id + ')" title="删除">✕</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderChart() {
    var goal = getGoal();
    var chart = document.getElementById('chart');
    var days = [];
    for (var i = 6; i >= 0; i--) {
      days.push({ date: dateStr(-i), label: dayLabel(-i), offset: i });
    }
    var maxVal = goal;
    days.forEach(function(d) { var t = getDayTotal(d.date); if (t > maxVal) maxVal = t; });

    chart.innerHTML = days.map(function(d) {
      var total = getDayTotal(d.date);
      var heightPct = maxVal > 0 ? (total / maxVal) * 100 : 0;
      var isToday = d.offset === 0;
      var isComplete = total >= goal && goal > 0;
      var barClass = 'bar';
      if (isToday) barClass += ' today';
      else if (isComplete) barClass += ' complete';
      return '<div class="bar-group">' +
        (total > 0 ? '<span class="bar-amount">' + total + '</span>' : '<span class="bar-amount">&nbsp;</span>') +
        '<div class="' + barClass + '" style="height: ' + Math.max(2, heightPct) + '%"></div>' +
        '<span class="bar-label">' + (isToday ? '今天' : d.label) + '</span>' +
        '</div>';
    }).join('');
  }

  function renderAll() {
    renderHeader();
    renderStatusBar();
    renderProgress();
    renderLog();
    renderChart();
  }

  // ---- Event listeners ----

  document.getElementById('customAmount').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addCustom();
  });
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.getElementById('backfillOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeBackfill();
  });
  document.getElementById('backfillDate').addEventListener('change', updateBackfillPreview);
  document.getElementById('backfillTime').addEventListener('change', updateBackfillPreview);
  document.getElementById('backfillAmount').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') backfillCustom();
  });

  // ---- Init ----
  renderAll();
</script>

</body>
</html>
